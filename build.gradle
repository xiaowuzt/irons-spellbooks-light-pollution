plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Needed for the ported dynamic text effects, which reach vanilla text rendering
    // through mixins. Nothing else in this mod uses one.
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

mixin {
    add sourceSets.main, 'irons_spellbooks_light_pollution.refmap.json'
    config 'irons_spellbooks_light_pollution.mixins.json'
    // Kept separate because it targets another mod rather than vanilla, and because its own
    // config sets defaultRequire to 0 so a change on their side is a warning, not a crash.
    config 'irons_spellbooks_light_pollution.compat.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // GeckoLib and Iron's Spellbooks ship SRG refmaps. Official-mapped
            // userdev runs need ForgeGradle to translate them through the
            // generated SRG-to-MCP map before mixins are applied.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            property 'net.minecraftforge.gradle.GradleStart.srg.srg-mcp', file("${buildDir}/createSrgToMcp/output.srg").absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            // Opt-in auto-join for the automated light-pass verification, which
            // has to be in a world to drive the camera:
            //   ./gradlew runClient -PautotestWorld=<save directory name>
            // A plain runClient is unaffected and still stops at the title screen.
            if (project.hasProperty('performanceSmoke')) {
                workingDirectory project.file('build/performance-smoke')
                property 'lightpollution.performanceSmoke', 'true'
                property 'forge.logging.console.level', 'info'
                args '--width', '854', '--height', '480'
                mods {
                    "${mod_id}" { source sourceSets.test }
                }
            } else if (project.hasProperty('autotestWorld')) {
                args '--quickPlaySingleplayer', project.property('autotestWorld')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('build/black-hole-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.test } }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Redspace'
        url = 'https://maven.redspace.io/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }

    // Local modpack jars are resolved as modules so ForgeGradle can deobfuscate
    // them for official-mapped userdev runs. A files(...) dependency bypasses
    // that transformation and leaves third-party mixins in SRG names.
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin's annotation processor, which generates the refmap the loader needs to
    // resolve our mixin targets against obfuscated names at runtime.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Prefer the matching local modpack jars for offline development; published
    // builds fall back to the upstream Maven coordinates.
    if (file('libs/geckolib-forge-1.20.1-4.8.3.jar').exists()) {
        implementation fg.deobf('local:geckolib-forge-1.20.1:4.8.3')
        implementation fg.deobf('local:curios-forge:5.14.1+1.20.1')
        implementation fg.deobf('local:irons_spellbooks:1.20.1-3.16.1')
        runtimeOnly fg.deobf('local:irons_lib:1.20.1-1.1.0')
        runtimeOnly fg.deobf('local:player-animation-lib-forge:1.0.2-rc1+1.20')

        // Oculus (the Forge port of Iris) plus the Embeddium it requires, for
        // testing how this mod behaves under a shader pack. Off unless asked for:
        // these two replace the renderer wholesale, so leaving them in every run
        // would mean every unrelated bug gets debugged against a non-standard
        // pipeline. Enable with:  ./gradlew runClient -PwithShaders
        if (project.hasProperty('withShaders')) {
            runtimeOnly fg.deobf('local:embeddium:0.3.31+mc1.20.1')
            runtimeOnly fg.deobf('local:oculus-mc1.20.1:1.8.0')
        }

        // ModernUI, to compile the mixin that routes its glyph submission through our effect
        // pipeline. compileOnly, so it stays a soft dependency: that mixin is @Pseudo with
        // require = 0 and skips itself when ModernUI is absent.
        if (file('libs/ModernUI-Forge-1.20.1-3.12.0.1.jar').exists()) {
            compileOnly fg.deobf('local:ModernUI-Forge-1.20.1:3.12.0.1')
            // At runtime only when asked for, because it replaces text rendering wholesale and every
            // unrelated text bug would otherwise be debugged against a non-standard path.
            //   ./gradlew runClient -PwithModernUI
            if (project.hasProperty('withModernUI')) {
                runtimeOnly fg.deobf('local:ModernUI-Forge-1.20.1:3.12.0.1')
            }
        }
    } else {
        implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:4.8.4")
        implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
        implementation fg.deobf("io.redspace:irons_spellbooks:${irons_spellbooks_version}")
        runtimeOnly fg.deobf("io.redspace:irons_lib:${irons_lib_version}")
    }

    // Just Enough Items, at runtime only.
    //
    // No plugin code is needed on this side. Every recipe this mod adds is an ordinary shaped
    // recipe, which JEI reads from the recipe manager by itself, and the Scroll Forge screen is
    // covered by Iron's Spells' own JEI plugin. So the API is not compiled against -- there is
    // nothing here to compile against it.
    //
    // Off unless asked for, like the shader pack below it: JEI changes every inventory screen, and
    // leaving it in every run would mean unrelated GUI work gets debugged against a modified one.
    //   ./gradlew runClient -PwithJei
    if (project.hasProperty('withJei')) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    // Preserve non-ASCII metadata on Windows; never use the host default charset.
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'irons_spellbooks_light_pollution.mixins.json,irons_spellbooks_light_pollution.compat.mixins.json'
        ])
    }

    // Keep the project license and every third-party notice with the distributed jar. The
    // resource copy of the Some of FX license is already included by processResources; the
    // explicit root files below make the notices easy to find at the jar root as well.
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('CREDITS.txt'))
    from(rootProject.file('LICENSE.txt'))
    from(rootProject.file('TEXTANIMATOR_LICENSE.txt'))

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ---------------------------------------------------------------------------
// Publishing to CurseForge and Modrinth.
//
// Tokens are never written here. They are read from Gradle properties, which
// belong in ~/.gradle/gradle.properties -- outside the repository, so they cannot
// be committed by accident:
//
//     curseforgeToken=...
//     modrinthToken=...
//
// Publish with:  ./gradlew publishMods
// Dry run with:  ./gradlew publishMods --dry-run    (validates, uploads nothing)
// ---------------------------------------------------------------------------
publishMods {
    // ForgeGradle reobfuscates the jar task in place, so this is the shippable jar.
    file = tasks.named('jar').flatMap { it.archiveFile }
    version = mod_version
    displayName = "${mod_name} ${mod_version} (Forge ${minecraft_version})"
    // Only the newest section: everything below the second heading is history that
    // the platforms already have on earlier releases.
    changelog = provider {
        def notes = file('CHANGELOG.md').text
        def sections = notes.split('(?m)^## ')
        sections.length > 1 ? '## ' + sections[1].trim() : notes
    }
    type = STABLE
    modLoaders.add('forge')
    // Validates everything and contacts nothing. Gradle's own --dry-run only prints
    // the task graph, so it would not exercise this plugin at all.
    //   ./gradlew publishMods -PpublishDryRun
    dryRun = project.hasProperty('publishDryRun')

    // Both platforms need the same dependency declared, so players are told they
    // need the base mod rather than finding out from a crash.
    curseforge {
        projectId = '1666561'
        accessToken = providers.gradleProperty('curseforgeToken')
        // Required on both sides: the spells register entities and damage types on
        // the server and the visuals are client-side, so half an install is broken.
        clientRequired = true
        serverRequired = true
        minecraftVersions.add(minecraft_version)
        requires { slug = 'irons-spells-n-spellbooks' }
    }
    modrinth {
        projectId = 'NoQdOUIm'
        accessToken = providers.gradleProperty('modrinthToken')
        minecraftVersions.add(minecraft_version)
        requires { slug = 'irons-spells-n-spellbooks' }
    }
}

// Visual-only regressions have no JUnit/network dependency. The GL probe is opt-in because it
// requires a real desktop driver; it creates a hidden context and never opens a Minecraft save.
tasks.register('verifyCinematicTimelines', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.CinematicTimelineChecks'
}
tasks.named('check') { dependsOn 'verifyCinematicTimelines' }

def performanceChecks = [
        AdaptiveQuality: 'com.gang.lightpollution.client.perf.AdaptiveQualityChecks',
        ServerDecorationBudget: 'com.gang.lightpollution.performance.ServerDecorationBudgetChecks',
        PulseShapeSamples: 'com.gang.lightpollution.performance.PulseShapeSamplesChecks',
        TextPerformance: 'com.gang.lightpollution.text.TextPerformanceChecks',
        CurveGeometry: 'com.gang.lightpollution.client.renderer.CurveGeometryChecks',
        StableLightSelector: 'com.gang.lightpollution.client.renderer.StableLightSelectorChecks',
        ScreenEffectBounds: 'com.gang.lightpollution.client.renderer.ScreenEffectBoundsChecks'
]
performanceChecks.each { label, entrypoint ->
    tasks.register("verify${label}", JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entrypoint
    }
    tasks.named('check') { dependsOn "verify${label}" }
}
tasks.register('verifyLightingShaders', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.LightingShaderChecks'
}
tasks.register('verifyCinematicShaders', JavaExec) {
    group = 'verification'
    description = 'Compile/link cinematic GLSL on the local GPU and check synthetic depth/colour output.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.CinematicShaderProbe'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders/core').absolutePath,
            file("${buildDir}/reports/cinematic-shaders").absolutePath
}

// Test subscribers are available only in this isolated client run, never in the mod jar.
if (project.hasProperty('performanceSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        dependsOn testClasses
        doFirst {
            def smokeDir = file("${buildDir}/performance-smoke")
            smokeDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(smokeDir, 'passed.txt').toPath())
            new File(smokeDir, 'options.txt').text = 'onboardAccessibility:false\nsoundCategory_master:0.0\nmaxFps:60\nenableVsync:false\n'
        }
        doLast {
            if (!file("${buildDir}/performance-smoke/passed.txt").isFile()) {
                throw new GradleException('Client smoke test did not complete; inspect build/performance-smoke/logs/latest.log')
            }
        }
    }
}

// Event Horizon: pure timeline checks in check; real OpenGL validation remains opt-in.
tasks.register('verifyEventHorizonShape', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.fx.EventHorizonShapeChecks'
}
tasks.named('check') { dependsOn 'verifyEventHorizonShape' }
tasks.register('verifyEventHorizonShaders', JavaExec) {
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.EventHorizonShaderChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders/core').absolutePath,
            file("${buildDir}/reports/event-horizon").absolutePath
}

// Redshift Abyss: pure timeline checks in check; real OpenGL validation remains opt-in.
tasks.register('verifyRedshiftAbyssShape', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.fx.RedshiftAbyssShapeChecks'
}
tasks.named('check') { dependsOn 'verifyRedshiftAbyssShape' }
tasks.register('verifyRedshiftAbyssShaders', JavaExec) {
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.RedshiftAbyssShaderChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders/core').absolutePath,
            file("${buildDir}/reports/redshift-abyss").absolutePath
}

tasks.register('verifyRedshiftAbyssResources', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.RedshiftAbyssResourceChecks'
    args file('src/main/resources').absolutePath
}
tasks.named('check') { dependsOn 'verifyRedshiftAbyssResources' }

// Black-hole family: independent source cores, shared parameter/resource contracts.
tasks.register('verifyBlackHoleMath', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.fx.BlackHoleMathChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/textures/effect/black_hole').absolutePath
}
tasks.register('verifyBlackHoleResources', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.BlackHoleResourceChecks'
    args file('src/main/resources').absolutePath
}
tasks.named('check') { dependsOn 'verifyBlackHoleMath', 'verifyBlackHoleResources' }
tasks.register('verifyBlackHoleShaders', JavaExec) {
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.BlackHoleShaderChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders').absolutePath,
            file("${buildDir}/reports/black-hole").absolutePath
}

// Server-authority integration tests. Test classes/structures are never packaged in the mod jar.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn testClasses
}

// Real-driver check for non-default pixel-unpack state left by Minecraft/other mods.
tasks.register('verifyTextureUploads', JavaExec) {
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.TextureUploadChecks'
}

// Pixel parity against the owner's original Buffer A (real OpenGL, opt-in).
tasks.register('verifyRedshiftSource', JavaExec) {
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.RedshiftSourceChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders/core').absolutePath,
            file('docs/black-hole/references/R1-original.txt').absolutePath
}

// Independent parity check for the supplied Buffer B/C/D/Image bloom pipeline (real OpenGL, opt-in).
tasks.register('verifyRedshiftBloomSource', JavaExec) {
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.RedshiftBloomSourceChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders/core').absolutePath,
            file('docs/black-hole/references/R1-original.txt').absolutePath,
            file("${buildDir}/reports/redshift-bloom-source").absolutePath
}

[
        verifyRedshiftDiskParameters: 'com.gang.lightpollution.fx.RedshiftDiskParametersChecks',
        verifyRedshiftTemporalPolicy: 'com.gang.lightpollution.fx.RedshiftTemporalPolicyChecks'
].each { taskName, checkMain ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = checkMain
    }
}
tasks.named('check') {
    dependsOn 'verifyRedshiftDiskParameters', 'verifyRedshiftTemporalPolicy'
}

// Generated guides/examples are audited, not silently regenerated by check.
tasks.register('generateConfigurationDocs', JavaExec) {
    group = 'documentation'
    description = 'Regenerate bilingual configuration guides and complete TOML examples from the Forge specs.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.ConfigurationDocumentation'
    workingDir projectDir
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.register('verifyConfiguration', JavaExec) {
    group = 'verification'
    description = 'Check real config fields, bilingual documentation, and safe comment-only language changes.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.ConfigurationChecks'
    workingDir projectDir
    enableAssertions = true
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.named('check') { dependsOn 'verifyConfiguration' }

// Full independent Buffer A ray transport, not just the shared disk function.
tasks.register('verifyRedshiftBufferASource', JavaExec) {
    group = 'verification'
    description = 'Compare original Buffer A ray transport against the current GPU trace with explicit Minecraft adaptations.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gang.lightpollution.client.renderer.RedshiftBufferASourceChecks'
    args file('src/main/resources/assets/irons_spellbooks_light_pollution/shaders/core').absolutePath,
            file('docs/black-hole/references/R1-original.txt').absolutePath,
            file("${buildDir}/reports/redshift-buffer-a-source").absolutePath
}
